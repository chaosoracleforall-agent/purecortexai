events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream oauth2_proxy {
        server oauth2-proxy:4180;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name mainnet-prelaunch.purecortex.ai;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name mainnet-prelaunch.purecortex.ai;

        ssl_certificate /etc/letsencrypt/live/mainnet-prelaunch.purecortex.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mainnet-prelaunch.purecortex.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;

        # Prelaunch gate for both HTTP and HTTPS entrypoints.
        auth_basic "PURECORTEX Prelaunch";
        auth_basic_user_file /etc/nginx/prelaunch.htpasswd;
        location @oauth2_sign_in {
            return 302 /oauth2/start?rd=$scheme://$host$request_uri;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
        }

        location /oauth2/ {
            proxy_pass http://oauth2_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
        }

        # Prelaunch emergency admin path:
        # Keep the owner surface available behind prelaunch basic-auth even when
        # Google OAuth redirect_uri config is still propagating.
        location = /admin/login {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL chaosoracleforall@gmail.com;
        }

        location = /admin-api/dev-session {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL chaosoracleforall@gmail.com;
        }

        location ^~ /admin-api/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL chaosoracleforall@gmail.com;
        }

        location ^~ /admin {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL chaosoracleforall@gmail.com;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL "";
        }

        location /ws/ {
            limit_req zone=ws burst=5 nodelay;
            limit_conn ws_conn 10;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL "";
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 10s;
        }

        location /health {
            proxy_pass http://backend;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL "";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PURECORTEX-AUTH-EMAIL "";
        }
    }
}
